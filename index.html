<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Scan</title>
    <meta name="description" content="Speichermedien erforschen: Explosionsansichten, Schätzfragen und Größenvergleiche von Diskette bis Festplatte – für den Unterricht.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="hud">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <h1>MEMORY<span>//</span>SCAN</h1>
        </div>
        <div class="hud-progress">
            <span class="hud-label" id="hud-label">Geräte geschafft</span>
            <div class="pips" id="pips" aria-hidden="true"></div>
            <span class="hud-count" id="hud-count" aria-describedby="hud-label">0 von 6</span>
        </div>
    </header>

    <main class="layout">
        <!-- Datei-Explorer (Simulation im Stil von Windows 11) -->
        <section class="panel explorer" id="explorer" aria-labelledby="explorer-title">
            <h2 class="panel-title" id="explorer-title">Datei-Explorer</h2>
            <div class="win" id="win">
                <div class="win-titlebar">
                    <span class="win-tab"><span class="win-tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 6.5a1.5 1.5 0 0 1 1.5-1.5h5l2 2h9a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5z" fill="#ffc83d" stroke="#e0a526"/></svg></span><span id="win-tab">Musik</span></span>
                    <span class="win-ctrls" aria-hidden="true"><i class="c-min"></i><i class="c-max"></i><i class="c-close"></i></span>
                </div>
                <div class="win-addr">
                    <span class="win-nav" aria-hidden="true">
                        <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                        <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                        <svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                    </span>
                    <div class="win-crumbs" id="win-path"></div>
                </div>
                <div class="win-cmd">
                    <button type="button" class="win-cmd-btn" id="cmd-props" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" fill="#fff" stroke="#5f6b7a" stroke-width="1.3"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#005fb8" stroke-width="1.5"/></svg>
                        Eigenschaften
                    </button>
                </div>
                <div class="win-body">
                    <nav class="win-side" id="win-side" aria-label="Ordner"></nav>
                    <div class="win-list" id="win-list" role="listbox" aria-label="Dateien"></div>
                </div>
                <div class="win-status" id="win-status"></div>

                <div class="ctx" id="ctx" role="menu" aria-label="Kontextmenü" hidden>
                    <button type="button" role="menuitem" data-act="open">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h6M5 5v14h14v-6M13 5h6v6M19 5l-8 8" fill="none" stroke="#5f6b7a" stroke-width="1.5"/></svg>
                        <span>Öffnen</span><kbd>Eingabe</kbd>
                    </button>
                    <hr>
                    <button type="button" role="menuitem" data-act="props">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" fill="#fff" stroke="#5f6b7a" stroke-width="1.3"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#005fb8" stroke-width="1.5"/></svg>
                        <span>Eigenschaften</span><kbd>Alt+Eingabe</kbd>
                    </button>
                </div>
                <div class="props" id="props" role="dialog" aria-modal="false" aria-labelledby="props-title" hidden></div>
            </div>

            <form class="loader" id="loader" autocomplete="off" novalidate>
                <p class="loader-head">Größe eintragen: <b id="loader-file">wähle zuerst eine Datei</b></p>
                <div class="loader-row">
                    <label class="sr-only" for="loader-size">Abgelesene Größe</label>
                    <input id="loader-size" type="text" inputmode="decimal" placeholder="z. B. 4,11" aria-describedby="loader-msg" disabled>
                    <label class="sr-only" for="loader-unit">Einheit</label>
                    <select id="loader-unit" disabled>
                        <option value="byte">Byte</option>
                        <option value="kb">KB</option>
                        <option value="mb" selected>MB</option>
                        <option value="gb">GB</option>
                    </select>
                    <button type="submit" class="btn btn-primary" id="loader-btn" disabled>Laden</button>
                </div>
                <p class="loader-msg" id="loader-msg" aria-live="polite"></p>
                <div class="ablage" id="ablage"></div>
            </form>
        </section>

        <!-- Aufgaben-Bühne -->
        <section class="panel stage" id="stage" aria-labelledby="stage-title">
            <div class="stage-head">
                <h2 class="panel-title" id="stage-title">Labor</h2>
                <ol class="steps" id="stepper" aria-label="Schritte"></ol>
            </div>
            <div class="task" id="task" role="status" aria-live="polite">
                <span class="task-label">Deine Aufgabe</span>
                <p id="task-text"></p>
            </div>
            <div class="stage-body" id="stage-body"></div>
        </section>

        <!-- Geräte-Hangar -->
        <section class="panel hangar" id="hangar" aria-labelledby="hangar-title">
            <h2 class="panel-title" id="hangar-title">Geräte</h2>
            <p class="hangar-hint">Welches Gerät liegt vor dir?</p>
            <div class="devices" id="devices"></div>
        </section>
    </main>

    <footer class="foot">
        <p>
            Entwickelt für Lernende und Lehrende |
            <a href="https://tinfo.space/teachers/Digitale_Tools/" target="_blank" rel="noopener">More apps and tools</a> |
            <a href="http://contact.tinfo.space/" id="contact-link">Kontakt</a> |
            <a href="https://linktr.ee/tinfo.space" target="_blank" rel="noopener">Links</a> |
            <a href="https://github.com/HansTydecks" target="_blank" rel="noopener">GitHub</a> |
            © 2025 Hans Tydecks
        </p>
        <button class="btn btn-ghost" id="reset-btn" type="button">Alles zurücksetzen</button>
    </footer>

    <div class="modal" id="modal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text">
            <h3 id="modal-title"></h3>
            <div class="modal-text" id="modal-text"></div>
            <div class="modal-btns" id="modal-btns"></div>
        </div>
    </div>

    <script src="js/units.js"></script>
    <script src="js/files-data.js"></script>
    <script src="js/devices-data.js"></script>
    <script src="js/exploded/common.js"></script>
    <script src="js/exploded/floppy.js"></script>
    <script src="js/exploded/optical.js"></script>
    <script src="js/exploded/usb.js"></script>
    <script src="js/exploded/phone.js"></script>
    <script src="js/exploded/hdd.js"></script>
    <script src="js/explorer.js"></script>
    <script src="js/fill-viz.js"></script>
    <script src="js/compare-viz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
